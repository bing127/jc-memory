[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "jiangcheng-memory"
version = "0.1.0"
description = "疆诚记忆 Python 同步、异步与嵌入式 SDK"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.maturin]
manifest-path = "../../crates/memory-python/Cargo.toml"
module-name = "jiangcheng_memory._native"
python-source = "src"
features = ["extension-module"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
