syntax = "proto3";

package jiangcheng.memory.v1;

import "google/protobuf/timestamp.proto";

// AccessScope 是客户端声明的资源边界，不携带服务端 Grant。
message AccessScope {
  string namespace_id = 1 [json_name = "namespaceId"];
  optional string tenant_id = 2 [json_name = "tenantId"];
  optional string user_id = 3 [json_name = "userId"];
  optional string agent_id = 4 [json_name = "agentId"];
  optional string project_id = 5 [json_name = "projectId"];
}

// JsonValue 无损区分 JSON 的有符号整数、无符号整数和浮点数。
message JsonValue {
  oneof kind {
    bool null_value = 1 [json_name = "nullValue"];
    bool bool_value = 2 [json_name = "boolValue"];
    sint64 int64_value = 3 [json_name = "int64Value"];
    uint64 uint64_value = 4 [json_name = "uint64Value"];
    double double_value = 5 [json_name = "doubleValue"];
    string string_value = 6 [json_name = "stringValue"];
    JsonArray array_value = 7 [json_name = "arrayValue"];
    JsonObject object_value = 8 [json_name = "objectValue"];
  }
}

// JsonArray 保留 JSON 数组顺序。
message JsonArray {
  repeated JsonValue values = 1 [json_name = "values"];
}

// JsonObject 以显式条目保存对象字段。
message JsonObject {
  repeated JsonObjectEntry entries = 1 [json_name = "entries"];
}

// JsonObjectEntry 保存一个 JSON 对象字段。
message JsonObjectEntry {
  string key = 1 [json_name = "key"];
  JsonValue value = 2 [json_name = "value"];
}

// BlobContent 保存内容寻址 Blob 的无损引用。
message BlobContent {
  string blob_id = 1 [json_name = "blobId"];
  string media_type = 2 [json_name = "mediaType"];
  uint64 byte_len = 3 [json_name = "byteLen"];
}

// FragmentContent 是权威 Fragment 的互斥内容载荷。
message FragmentContent {
  oneof value {
    string text = 1 [json_name = "text"];
    JsonValue json = 2 [json_name = "json"];
    BlobContent blob = 3 [json_name = "blob"];
  }
}

enum FragmentKind {
  FRAGMENT_KIND_UNSPECIFIED = 0;
  FRAGMENT_KIND_OBSERVATION = 1;
  FRAGMENT_KIND_CLAIM = 2;
  FRAGMENT_KIND_INFERENCE = 3;
  FRAGMENT_KIND_PREDICTION = 4;
  FRAGMENT_KIND_DECISION = 5;
  FRAGMENT_KIND_ACTION = 6;
  FRAGMENT_KIND_TOOL_CALL = 7;
  FRAGMENT_KIND_TOOL_RESULT = 8;
  FRAGMENT_KIND_OUTCOME = 9;
  FRAGMENT_KIND_CORRECTION = 10;
  FRAGMENT_KIND_CONSTRAINT = 11;
  FRAGMENT_KIND_PREFERENCE = 12;
  FRAGMENT_KIND_FACT = 13;
  FRAGMENT_KIND_FAILURE = 14;
  FRAGMENT_KIND_SUCCESS = 15;
  FRAGMENT_KIND_PLAN = 16;
  FRAGMENT_KIND_APPROVAL = 17;
  FRAGMENT_KIND_REJECTION = 18;
  FRAGMENT_KIND_STATE_TRANSITION = 19;
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_USER = 1;
  SOURCE_TYPE_AGENT = 2;
  SOURCE_TYPE_MODEL = 3;
  SOURCE_TYPE_TOOL = 4;
  SOURCE_TYPE_IMPORT = 5;
  SOURCE_TYPE_SYSTEM = 6;
}

// FragmentSource 保存完整来源和观察者信息。
message FragmentSource {
  SourceType source_type = 1 [json_name = "sourceType"];
  string source_id = 2 [json_name = "sourceId"];
  optional string actor_id = 3 [json_name = "actorId"];
  optional string observer_id = 4 [json_name = "observerId"];
  optional string tool_id = 5 [json_name = "toolId"];
  optional string uri = 6 [json_name = "uri"];
}

enum Perspective {
  PERSPECTIVE_UNSPECIFIED = 0;
  PERSPECTIVE_FIRST_PERSON = 1;
  PERSPECTIVE_SECOND_PERSON = 2;
  PERSPECTIVE_THIRD_PERSON = 3;
  PERSPECTIVE_SYSTEM = 4;
  PERSPECTIVE_TOOL = 5;
}

enum ValidityStatus {
  VALIDITY_STATUS_UNSPECIFIED = 0;
  VALIDITY_STATUS_UNVERIFIED = 1;
  VALIDITY_STATUS_VERIFIED = 2;
  VALIDITY_STATUS_DISPUTED = 3;
  VALIDITY_STATUS_SUPERSEDED = 4;
  VALIDITY_STATUS_INVALIDATED = 5;
  VALIDITY_STATUS_QUARANTINED = 6;
}

enum SecurityLabel {
  SECURITY_LABEL_UNSPECIFIED = 0;
  SECURITY_LABEL_PUBLIC = 1;
  SECURITY_LABEL_INTERNAL = 2;
  SECURITY_LABEL_CONFIDENTIAL = 3;
  SECURITY_LABEL_RESTRICTED = 4;
}

enum VerificationMethod {
  VERIFICATION_METHOD_UNSPECIFIED = 0;
  VERIFICATION_METHOD_MANUAL = 1;
  VERIFICATION_METHOD_TOOL = 2;
  VERIFICATION_METHOD_EXTERNAL_SOURCE = 3;
  VERIFICATION_METHOD_CROSS_EVIDENCE = 4;
}

// EvidenceRef 无损保留可验证的 Fragment/Event 引用。
message EvidenceRef {
  string id = 1 [json_name = "id"];
  optional string fragment_id = 2 [json_name = "fragmentId"];
  optional string event_id = 3 [json_name = "eventId"];
  VerificationMethod method = 4 [json_name = "method"];
  optional string note = 5 [json_name = "note"];
}

// CognitiveFragment 是可直接转换为领域命令的完整权威输入。
message CognitiveFragment {
  string id = 1 [json_name = "id"];
  AccessScope scope = 2 [json_name = "scope"];
  optional string session_id = 3 [json_name = "sessionId"];
  optional string trace_id = 4 [json_name = "traceId"];
  FragmentKind kind = 5 [json_name = "kind"];
  FragmentContent content = 6 [json_name = "content"];
  FragmentSource source = 7 [json_name = "source"];
  Perspective perspective = 8 [json_name = "perspective"];
  google.protobuf.Timestamp occurred_at = 9 [json_name = "occurredAt"];
  google.protobuf.Timestamp observed_at = 10 [json_name = "observedAt"];
  float confidence = 11 [json_name = "confidence"];
  float importance = 12 [json_name = "importance"];
  ValidityStatus validity = 13 [json_name = "validity"];
  SecurityLabel security_label = 14 [json_name = "securityLabel"];
  repeated EvidenceRef evidence = 15 [json_name = "evidence"];
  JsonObject metadata = 16 [json_name = "metadata"];
}

// ObserveCommand 直接携带完整强类型 Fragment。
message ObserveCommand {
  CognitiveFragment fragment = 1 [json_name = "fragment"];
}

// RecallMode 定义有界 Recall 的选择与遍历意图。
enum RecallMode {
  RECALL_MODE_UNSPECIFIED = 0;
  RECALL_MODE_EXACT = 1;
  RECALL_MODE_SEMANTIC = 2;
  RECALL_MODE_TEMPORAL = 3;
  RECALL_MODE_CAUSAL = 4;
  RECALL_MODE_ENTITY = 5;
  RECALL_MODE_ASSOCIATIVE = 6;
  RECALL_MODE_PROCEDURAL = 7;
  RECALL_MODE_CURRENT_STATE = 8;
  RECALL_MODE_HISTORICAL_STATE = 9;
  RECALL_MODE_DEEP_RECONSTRUCTION = 10;
}

// RecallLimits 保存本次请求的硬执行预算。
message RecallLimits {
  uint64 max_seeds = 1 [json_name = "maxSeeds"];
  uint64 max_neighbors = 2 [json_name = "maxNeighbors"];
  uint64 max_hops = 3 [json_name = "maxHops"];
  uint64 max_nodes = 4 [json_name = "maxNodes"];
  uint64 timeout_ms = 5 [json_name = "timeoutMs"];
}

// RecallCommand 是模型无关的有界检索请求。
message RecallCommand {
  RecallMode mode = 1 [json_name = "mode"];
  string text = 2 [json_name = "text"];
  repeated string entities = 3 [json_name = "entities"];
  optional google.protobuf.Timestamp at_time = 4 [json_name = "atTime"];
  RecallLimits limits = 5 [json_name = "limits"];
}

// RequestEnvelope 是所有命令共享的稳定请求外壳。
message RequestEnvelope {
  string api_version = 1 [json_name = "apiVersion"];
  string request_id = 2 [json_name = "requestId"];
  AccessScope access_scope = 3 [json_name = "accessScope"];

  oneof command {
    ObserveCommand observe = 10 [json_name = "observe"];
    RecallCommand recall = 11 [json_name = "recall"];
  }
}

// ObserveResult 是权威 Observe 的稳定公开结果。
message ObserveResult {
  string fragment_id = 1 [json_name = "fragmentId"];
  string event_id = 2 [json_name = "eventId"];
  uint64 sequence = 3 [json_name = "sequence"];
  string content_hash = 4 [json_name = "contentHash"];
  bool created = 5 [json_name = "created"];
  bool quarantined = 6 [json_name = "quarantined"];
}

// EvidenceView 指向支撑派生结果的权威记录。
message EvidenceView {
  string fragment_id = 1 [json_name = "fragmentId"];
  optional string event_id = 2 [json_name = "eventId"];
  optional string evidence_ref_id = 3 [json_name = "evidenceRefId"];
}

// StateView 保存一个有效状态版本及其证据。
message StateView {
  string state_id = 1 [json_name = "stateId"];
  string version_id = 2 [json_name = "versionId"];
  string key = 3 [json_name = "key"];
  JsonValue value = 4 [json_name = "value"];
  google.protobuf.Timestamp valid_from = 5 [json_name = "validFrom"];
  optional google.protobuf.Timestamp valid_to = 6 [json_name = "validTo"];
  ValidityStatus validity = 7 [json_name = "validity"];
  repeated EvidenceView evidence = 8 [json_name = "evidence"];
}

// SurfaceMemberPoint 保存 Surface 成员 Point 及其权重。
message SurfaceMemberPoint {
  string point_id = 1 [json_name = "pointId"];
  float weight = 2 [json_name = "weight"];
}

// SurfaceView 保存一个激活的 Surface 版本。
message SurfaceView {
  string surface_id = 1 [json_name = "surfaceId"];
  uint64 version = 2 [json_name = "version"];
  SurfaceStatus status = 3 [json_name = "status"];
  repeated SurfaceMemberPoint member_points = 4 [json_name = "memberPoints"];
  float confidence = 5 [json_name = "confidence"];
  repeated EvidenceView evidence = 6 [json_name = "evidence"];
}

enum SurfaceStatus {
  SURFACE_STATUS_UNSPECIFIED = 0;
  SURFACE_STATUS_ACTIVE = 1;
  SURFACE_STATUS_FROZEN = 2;
  SURFACE_STATUS_INACTIVE = 3;
  SURFACE_STATUS_SPLIT = 4;
  SURFACE_STATUS_MERGED = 5;
}

// EpisodeView 保存一个权威 Event 及其可重建摘要。
message EpisodeView {
  string event_id = 1 [json_name = "eventId"];
  string fragment_id = 2 [json_name = "fragmentId"];
  google.protobuf.Timestamp occurred_at = 3 [json_name = "occurredAt"];
  string summary = 4 [json_name = "summary"];
  repeated EvidenceView evidence = 5 [json_name = "evidence"];
}

enum PointKind {
  POINT_KIND_UNSPECIFIED = 0;
  POINT_KIND_FACT = 1;
  POINT_KIND_DECISION = 2;
  POINT_KIND_CONSTRAINT = 3;
  POINT_KIND_STATE_CHANGE = 4;
  POINT_KIND_ACTION = 5;
  POINT_KIND_RESULT = 6;
  POINT_KIND_FAILURE = 7;
  POINT_KIND_PREFERENCE = 8;
  POINT_KIND_CORRECTION = 9;
}

// PointView 保存派生 Point 及其权威来源。
message PointView {
  string point_id = 1 [json_name = "pointId"];
  PointKind kind = 2 [json_name = "kind"];
  float confidence = 3 [json_name = "confidence"];
  ValidityStatus validity = 4 [json_name = "validity"];
  repeated string source_fragments = 5 [json_name = "sourceFragments"];
}

// RecallPath 保存一次有界图遍历路径。
message RecallPath {
  repeated string point_ids = 1 [json_name = "pointIds"];
  repeated string edge_ids = 2 [json_name = "edgeIds"];
  float score = 3 [json_name = "score"];
}

// ProcedureView 保存证据支撑的程序结果统计。
message ProcedureView {
  string procedure_key = 1 [json_name = "procedureKey"];
  uint32 sample_count = 2 [json_name = "sampleCount"];
  double success_rate = 3 [json_name = "successRate"];
  repeated EvidenceView evidence = 4 [json_name = "evidence"];
}

enum KnowledgeKind {
  KNOWLEDGE_KIND_UNSPECIFIED = 0;
  KNOWLEDGE_KIND_FACT = 1;
  KNOWLEDGE_KIND_PREFERENCE = 2;
  KNOWLEDGE_KIND_CONSTRAINT = 3;
}

// KnowledgeView 保存一个带证据的结构化知识项。
message KnowledgeView {
  string point_id = 1 [json_name = "pointId"];
  KnowledgeKind kind = 2 [json_name = "kind"];
  JsonValue value = 3 [json_name = "value"];
  float confidence = 4 [json_name = "confidence"];
  ValidityStatus validity = 5 [json_name = "validity"];
  repeated EvidenceView evidence = 6 [json_name = "evidence"];
}

// ConflictView 保存可见的冲突关系及证据。
message ConflictView {
  repeated string point_ids = 1 [json_name = "pointIds"];
  repeated string edge_ids = 2 [json_name = "edgeIds"];
  repeated EvidenceView evidence = 3 [json_name = "evidence"];
}

enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_TEMPORAL_BEFORE = 1;
  EDGE_KIND_TEMPORAL_AFTER = 2;
  EDGE_KIND_CAUSES = 3;
  EDGE_KIND_CAUSED_BY = 4;
  EDGE_KIND_SUPPORTS = 5;
  EDGE_KIND_CONTRADICTS = 6;
  EDGE_KIND_SUPERSEDES = 7;
  EDGE_KIND_DEPENDS_ON = 8;
  EDGE_KIND_PART_OF = 9;
  EDGE_KIND_SAME_ENTITY = 10;
  EDGE_KIND_CO_ACTIVATED = 11;
  EDGE_KIND_PREDICTED_BY = 12;
  EDGE_KIND_VALIDATED_BY = 13;
  EDGE_KIND_DISPROVED_BY = 14;
  EDGE_KIND_RECALLED_BY = 15;
  EDGE_KIND_USED_IN_DECISION = 16;
  EDGE_KIND_EXECUTED_AS = 17;
  EDGE_KIND_RESULTED_IN = 18;
}

// MissingEvidence 描述尚未补足的证据关系。
message MissingEvidence {
  string point_id = 1 [json_name = "pointId"];
  repeated EdgeKind expected_edge_kinds = 2 [json_name = "expectedEdgeKinds"];
  string description = 3 [json_name = "description"];
}

// Coverage 保存 Recall 的有界覆盖与截断信息。
message Coverage {
  uint64 seed_count = 1 [json_name = "seedCount"];
  uint64 visited_nodes = 2 [json_name = "visitedNodes"];
  uint64 max_depth = 3 [json_name = "maxDepth"];
  uint64 evidence_count = 4 [json_name = "evidenceCount"];
  uint64 missing_evidence_count = 5 [json_name = "missingEvidenceCount"];
  bool truncated = 6 [json_name = "truncated"];
}

// MemoryPacket 是模型无关且证据关联的 Recall 结果。
message MemoryPacket {
  string query_id = 1 [json_name = "queryId"];
  RecallMode intent = 2 [json_name = "intent"];
  repeated StateView current_states = 3 [json_name = "currentStates"];
  repeated StateView historical_states = 4 [json_name = "historicalStates"];
  repeated SurfaceView activated_surfaces = 5 [json_name = "activatedSurfaces"];
  repeated EpisodeView episodes = 6 [json_name = "episodes"];
  repeated PointView points = 7 [json_name = "points"];
  repeated RecallPath paths = 8 [json_name = "paths"];
  repeated ProcedureView procedures = 9 [json_name = "procedures"];
  repeated KnowledgeView constraints = 10 [json_name = "constraints"];
  repeated KnowledgeView preferences = 11 [json_name = "preferences"];
  repeated EpisodeView past_failures = 12 [json_name = "pastFailures"];
  repeated EvidenceView evidence = 13 [json_name = "evidence"];
  repeated ConflictView conflicts = 14 [json_name = "conflicts"];
  repeated MissingEvidence missing_evidence = 15 [json_name = "missingEvidence"];
  Coverage coverage = 16 [json_name = "coverage"];
  float confidence = 17 [json_name = "confidence"];
  string recommended_context = 18 [json_name = "recommendedContext"];
}

// ResponseEnvelope 把业务响应关联回原协议版本和请求标识。
message ResponseEnvelope {
  string api_version = 1 [json_name = "apiVersion"];
  string request_id = 2 [json_name = "requestId"];

  oneof response {
    ObserveResult observe = 10 [json_name = "observe"];
    MemoryPacket recall = 11 [json_name = "recall"];
  }
}

// ErrorCode 是 Embedded、REST 与 gRPC 共用的稳定错误分类。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_INTERNAL = 6;
}

// ErrorEnvelope 不暴露内部敏感错误链，只提供稳定分类和关联字段。
message ErrorEnvelope {
  string api_version = 1 [json_name = "apiVersion"];
  string request_id = 2 [json_name = "requestId"];
  ErrorCode code = 3 [json_name = "code"];
  string message = 4 [json_name = "message"];
}

// MemoryService 是共享 CommandBus 的最小网络 gRPC 门面。
service MemoryService {
  // Execute 接收稳定请求外壳并返回稳定响应外壳。
  rpc Execute(RequestEnvelope) returns (ResponseEnvelope);
}
