[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiangcheng-memory-models"
version = "0.1.0"
description = "疆诚记忆可重复的离线模型训练工程"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "pyyaml>=6,<7",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"models" = "."}
packages = ["models", "models.training", "models.export"]
