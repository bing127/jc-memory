[workspace]
resolver = "3"
members = [
  "crates/memory-protocol",
  "crates/memory-events",
  "crates/memory-storage",
  "crates/memory-episodic",
  "crates/memory-semantic",
  "crates/memory-graph",
  "crates/memory-surface",
  "crates/memory-activation",
  "crates/memory-security",
  "crates/memory-neural",
  "crates/memory-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
authors = ["Jiangcheng Memory Contributors"]

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
