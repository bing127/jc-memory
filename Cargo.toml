[workspace]
resolver = "3"
members = [
  "crates/memory-protocol",
  "crates/memory-events",
  "crates/memory-storage",
  "crates/memory-episodic",
  "crates/memory-semantic",
  "crates/memory-graph",
  "crates/memory-surface",
  "crates/memory-activation",
  "crates/memory-security",
  "crates/memory-neural",
  "crates/memory-consolidation",
  "crates/memory-runtime",
  "crates/memory-core",
  "crates/memory-node",
  "crates/memory-ffi",
  "crates/memory-uniffi",
  "crates/memory-python",
  "adapters/hermes",
  "adapters/openclaw",
  "adapters/mem0",
  "services/memory-server",
  "services/memory-sidecar",
  "services/memory-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
authors = ["Jiangcheng Memory Contributors"]

[workspace.dependencies]
aes-gcm = "0.11"
axum = "0.8"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
getrandom = "0.4"
napi = { version = "3.12", features = ["tokio_rt"] }
napi-derive = "3.6"
pyo3 = { version = "0.29", features = ["macros"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
proptest = "1"
prost = "0.14"
prost-types = "0.14"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }
yaml_serde = "0.10"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
