version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/sdk/node"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/sdk/python"
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: "/sdk/kotlin"
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: "/sdk/java"
    schedule:
      interval: monthly
