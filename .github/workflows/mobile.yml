name: Mobile SDK

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android assemble
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Android assemble
        run: gradle -p sdk/kotlin/android assemble

  swift:
    name: Swift Package
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Swift test
        run: swift test --package-path sdk/swift
