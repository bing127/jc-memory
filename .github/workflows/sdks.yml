name: SDK Contracts

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-python-go:
    name: Node Python Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node SDK
        shell: bash
        run: |
          corepack enable
          corepack pnpm@9.15.9 --dir sdk/node install --frozen-lockfile
          corepack pnpm@9.15.9 --dir sdk/node test
          corepack pnpm@9.15.9 --dir sdk/node typecheck
      - name: Python SDK
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e 'sdk/python[dev]'
          python3 -m pytest sdk/python/tests -q
      - name: Go SDK
        shell: bash
        run: go test ./...
        working-directory: sdk/go

  jvm:
    name: Kotlin JVM and Java SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Kotlin JVM SDK
        run: gradle -p sdk/kotlin test --no-daemon
      - name: Java SDK
        run: gradle -p sdk/java test --no-daemon

  swift:
    name: Swift SDK
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Swift Fixture
        run: swift test --package-path sdk/swift
