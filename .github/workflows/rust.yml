name: Rust Quality

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quality:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: 安装固定 Rust 工具链
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: 格式检查
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: 严格 Clippy
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features -- -D warnings
      - name: 安装固定 Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.64.0"
          github_token: ${{ github.token }}
      - name: Workspace 测试
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --all-features --exclude jc-memory-python
      - name: Python 绑定 crate 测试
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test -p jc-memory-python --no-default-features
      - name: Workspace 文档
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" doc --workspace --no-deps
