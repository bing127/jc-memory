name: Benchmark Smoke

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Reproducible Benchmark Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Benchmark Smoke
        shell: bash
        run: scripts/benchmark/smoke.sh --output target/benchmarks/ci-smoke.json
      - name: Million Fragments 小规模恢复
        shell: bash
        run: scripts/benchmark/million-fragments.sh --fragments 1000 --output target/benchmarks/million-fragments-smoke.json
